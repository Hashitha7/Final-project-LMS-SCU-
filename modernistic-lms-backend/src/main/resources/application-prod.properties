# ── Production Profile ──────────────────────────────────
# All values come from Render environment variables

spring.application.name=modernistic-lms-backend

# Dynamic port (Render sets PORT env var)
server.port=${PORT:8080}

# ── MySQL (Aiven Free Tier) ──────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/modernistic_lms}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ── JWT Configuration ────────────────────────────────────
modernisticlms.app.jwtSecret=${JWT_SECRET:DefaultSecretKeyChangeThisInProduction1234567890}
modernisticlms.app.jwtExpirationMs=86400000

# ── Logging (less verbose in prod) ───────────────────────
logging.level.org.springframework.web=WARN
logging.level.com.modernisticlms.backend=INFO

# ── Email / SMTP ─────────────────────────────────────────
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.institute.email=${INSTITUTE_EMAIL:}

# ── AWS S3 Configuration ────────────────────────────────
aws.accessKeyId=${AWS_ACCESS_KEY_ID:}
aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY:}
aws.s3.bucket=${AWS_S3_BUCKET:user-hash}
aws.s3.region=${AWS_S3_REGION:us-east-1}

# ── Zoom Configuration ──────────────────────────────────
zoom.enabled=${ZOOM_ENABLED:false}
zoom.account-id=${ZOOM_ACCOUNT_ID:}
zoom.client-id=${ZOOM_CLIENT_ID:}
zoom.client-secret=${ZOOM_CLIENT_SECRET:}
zoom.user-id=me
zoom.token-url=https://zoom.us/oauth/token
zoom.api-base-url=https://api.zoom.us/v2

# ── Flask AI Service URL ────────────────────────────────
flask.service.url=${FLASK_SERVICE_URL:http://localhost:5000}

# ── Frontend URL (for CORS) ─────────────────────────────
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
